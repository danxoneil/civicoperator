name: Build RHT State Pages

# Regenerates the 50 per-state RHT profile pages under work/rht/states/.
#
# Data sources:
#   - states_data.json   <- monday.com "States - RHT" board (fetched live here)
#   - dispatch_index.json <- parsed from the latest Substack export
#   - content.json        <- authored Q&A (edited by hand, committed)
#
# NOTE ON THE SUBSTACK EXPORTS: the export lives in Google Drive, which this
# runner cannot see. dispatch_index.json is therefore expected to be COMMITTED
# to the repo (refreshed by parse_dispatches.py wherever the Drive export is
# reachable). A push to dispatch_index.json triggers this workflow, which then
# re-pulls Monday and rebuilds the HTML. See state_pages/README.md.

on:
  schedule:
    - cron: '0 8 * * *'          # nightly, 08:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state-spending-monitor/state_pages/dispatch_index.json'
      - 'state-spending-monitor/state_pages/content.json'
      - 'state-spending-monitor/state_pages/build.py'
      - 'state-spending-monitor/state_pages/rural_maps.json'
      - 'state-spending-monitor/state_pages/state_facts.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: state-spending-monitor/state_pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Monday data
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python fetch_monday.py

      # Refresh outlays.json for the /outlays/ page from the public USASpending
      # API (obligated vs disbursed per state). No secrets — the --outlays-only
      # path skips the Monday board and email. Non-fatal: if USASpending is down,
      # build.py falls back to the last committed outlays.json.
      - name: Refresh outlays.json from USASpending
        working-directory: state-spending-monitor
        continue-on-error: true
        run: |
          pip install requests==2.32.5
          python spending_monitor.py --outlays-only

      # NOTE: procurements.json and dispatch_sources.json are intentionally NOT
      # produced or committed here — they are product data (RHTP Alerts feed /
      # paywalled newsletter content) and must never land in this public repo.

      - name: Build state pages
        run: python build.py

      # Regenerate sitemap.xml from the committed HTML tree so it tracks any
      # pages added/removed by the build above. See scripts/generate_sitemap.py.
      - name: Regenerate sitemap.xml
        working-directory: ${{ github.workspace }}
        run: python scripts/generate_sitemap.py

      # Regenerate the Markdown companions (Accept: text/markdown negotiation,
      # served via worker/markdown-negotiation.js) from the rebuilt HTML.
      - name: Regenerate Markdown companions
        working-directory: ${{ github.workspace }}
        run: |
          pip install beautifulsoup4 markdownify
          python scripts/generate_markdown.py

      - name: Commit changes if any
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add work/rht/states state-spending-monitor/state_pages/states_data.json state-spending-monitor/state_pages/outlays.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "RHT: rebuild state pages [skip ci]"
            git push
          fi
